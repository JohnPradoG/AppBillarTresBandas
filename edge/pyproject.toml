[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "billar-edge"
version = "0.1.0"
description = "Servicios de cada mesa: grabación continua, índice, limpieza, monitor de salud y pantalla táctil."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
billar = "billar_edge.cli:main"

[tool.setuptools.packages.find]
include = ["billar_edge*"]

[tool.setuptools.package-data]
billar_edge = ["static/*", "static/**/*", "assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
